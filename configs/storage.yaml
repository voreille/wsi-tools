tiling:
  coords:
    kind: json
    dir: patches_json/
  stitches:
    dir: stitches/
  masks:
    dir: masks/

embedding:
  features:
    kind: h5
    dir: h5_files/
    # Embeddings barely compress (LZF ~1.0x) and small auto-chunks make reads
    # CPU-bound: store uncompressed in row-aligned chunks.
    compression: null
    dtype: float32
    chunk_rows: 1024
