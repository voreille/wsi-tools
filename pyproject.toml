[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsitools"
version = "0.1.0"
description = "Whole-slide image tiling, tile embedding and tiling/embedding stores"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3", 
    "numpy",
    "scipy",
    "click",
    "tqdm",
    "opencv-python-headless",
    "openslide-python",
    "openslide-bin",
    "pillow",
    "h5py",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-cov>=4.0",
]
# Tile embedding and tile prediction (wsi-embed). Torch is left unpinned so the
# consuming project chooses the version / CUDA build.
embed = [
    "torch",
    "torchvision",
    "timm",
]

[project.scripts]
wsi-tile = "wsitools.tiling.create_patches:main"
wsi-embed = "wsitools.embedding.extract_features:main"
wsi-repack = "wsitools.storage.repack:main"

[project.entry-points."wsitools.models"]
test_resnet50 = "wsitools.models.builtin.test_resnet50.load:load"

[tool.setuptools.packages.find]
where = ["src"]
